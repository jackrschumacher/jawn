<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Are you a Jawn?</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link rel="icon" type="image/svg+xml" href="logo.svg">
    
    </head>
    <body>

        <div id="global-stats-pill" class="stats-pill">
            <span class="stat-item"><i class="bi bi-arrow-repeat"></i> <span id="stat-spins">...</span></span>
            <div class="divider"></div>
            <span class="stat-item"><i class="bi bi-check-circle"></i> <span id="stat-jawns">...</span></span>
            <div class="divider"></div>
            <span class="stat-item"><i class="bi bi-x-circle"></i> <span id="stat-not-jawns">...</span></span>
        </div>

        <a href="https://github.com/jackrschumacher/jawn" target="_blank" rel="noopener noreferrer" class="icon-button" id="github-link" aria-label="View on GitHub">
            <i class="bi bi-github"></i>
        </a>
        
        <div class="top-controls">
            <button id="theme-toggle" class="icon-button" aria-label="Toggle theme">
                <i class="icon-sun bi bi-sun-fill"></i>
                <i class="icon-moon bi bi-moon-fill"></i>
            </button>
        </div>

        <main class="main-content">
            <div class="column-left">
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div id="wheel">
                        <div class="wheel-text" style="--i: 0;"><span>JAWN</span></div>
                        <div class="wheel-text" style="--i: 1;"><span>NOT JAWN</span></div>
                        <div class="wheel-text flip-text" style="--i: 2;"><span>JAWN</span></div>
                        <div class="wheel-text flip-text" style="--i: 3;"><span>NOT JAWN</span></div>
                        <div class="wheel-text flip-text" style="--i: 4;"><span>JAWN</span></div>
                        <div class="wheel-text flip-text" style="--i: 5;"><span>NOT JAWN</span></div>
                        <div class="wheel-text" style="--i: 6;"><span>JAWN</span></div>
                        <div class="wheel-text" style="--i: 7;"><span>NOT JAWN</span></div>
                    </div>
                </div>
        
                <div class="input-container">
                    <h2>Who is a Jawn?</h2>
                    <textarea id="name-list-input" rows="5" placeholder="Enter names, one per line..."></textarea>
                    <button id="spin-button" class="primary-button">FIND OUT!</button>
                </div>
            </div>

            <div class="column-right">
                <div class="results-container">
                    <div class="results-header">
                        <h3 id="result-title"></h3>
                        <button class="icon-button" id="copy-button" aria-label="Copy all results">
                            <i class="icon-copy bi bi-clipboard-check"></i>
                            <i class="icon-copied bi bi-check-lg"></i>
                        </button>
                    </div>
                    <div id="results-placeholder" class="is-placeholder">Your results will appear here...</div>
                </div>
            </div>
        </main>

        <div id="stats-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Community Statistics</h2>
                    <button id="close-stats" class="close-button"><i class="bi bi-x-lg"></i></button>
                </div>
                
                <div class="chart-container">
                    <canvas id="statsChart"></canvas>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="modal-total-spins">0</h3>
                        <span>Total Spins</span>
                    </div>
                    <div class="stat-card">
                        <h3 id="modal-total-jawns" class="text-jawn">0</h3>
                        <span>Total Jawns</span>
                    </div>
                    <div class="stat-card">
                        <h3 id="modal-total-not-jawns" class="text-not-jawn">0</h3>
                        <span>Total Not Jawns</span>
                    </div>
                </div>

                <div class="history-section">
                    <h3>History by Month</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Month</th>
                                    <th>Spins</th>
                                    <th>Jawns</th>
                                    <th>Not Jawns</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
            import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
            // NEW: Import Authentication functions
            import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyBESuUn74foo-ZcplfXJK5DDZOBKIOajdQ",
                authDomain: "jawn-90a49.firebaseapp.com",
                databaseURL: "https://jawn-90a49-default-rtdb.firebaseio.com",
                projectId: "jawn-90a49",
                storageBucket: "jawn-90a49.firebasestorage.app",
                messagingSenderId: "1009150566800",
                appId: "1:1009150566800:web:62e5596171656bc96e5315"
            };

            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            // NEW: Initialize Auth
            const auth = getAuth(app);

            // NEW: Automatically sign in anonymously
            // This ensures the user has a valid auth token that satisfies "auth != null" in rules
            signInAnonymously(auth)
                .then(() => {
                    console.log("Signed in anonymously");
                })
                .catch((error) => {
                    console.error("Authentication failed. Use the Firebase Console to enable Anonymous Auth and add this domain to Authorized Domains.", error);
                });

            let myChart = null;

            // --- Function to update chart colors dynamically ---
            function updateChartColors() {
                if (!myChart) return;
                
                const style = getComputedStyle(document.body);
                const jawnColor = style.getPropertyValue('--jawn-color').trim();
                const notJawnColor = style.getPropertyValue('--not-jawn-color').trim();
                const textColor = style.getPropertyValue('--text-color').trim();
                const gridColor = style.getPropertyValue('--chart-grid-color').trim();
                const lineColor = style.getPropertyValue('--chart-line-color').trim();

                if (myChart.data.datasets[0]) {
                    myChart.data.datasets[0].backgroundColor = jawnColor;
                }
                if (myChart.data.datasets[1]) {
                    myChart.data.datasets[1].backgroundColor = notJawnColor;
                }
                if (myChart.data.datasets[2]) {
                    myChart.data.datasets[2].backgroundColor = lineColor;
                    myChart.data.datasets[2].borderColor = lineColor;
                }

                if (myChart.options.scales.x) myChart.options.scales.x.ticks.color = textColor;
                if (myChart.options.scales.y) {
                    myChart.options.scales.y.ticks.color = textColor;
                    myChart.options.scales.y.grid.color = gridColor;
                }
                
                if (myChart.options.plugins.legend) myChart.options.plugins.legend.labels.color = textColor;

                myChart.update();
            }

            function initChart(historyData) {
                const ctx = document.getElementById('statsChart').getContext('2d');
                
                const months = Object.keys(historyData).sort();
                const spinsData = months.map(m => historyData[m].spins || 0);
                const jawnsData = months.map(m => historyData[m].jawns || 0);
                const notJawnsData = months.map(m => historyData[m].notJawns || 0);
                
                if (myChart) myChart.destroy();

                const style = getComputedStyle(document.body);
                const jawnColor = style.getPropertyValue('--jawn-color').trim();
                const notJawnColor = style.getPropertyValue('--not-jawn-color').trim();
                const textColor = style.getPropertyValue('--text-color').trim();
                const gridColor = style.getPropertyValue('--chart-grid-color').trim();
                const lineColor = style.getPropertyValue('--chart-line-color').trim();

                myChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: 'Jawns',
                                data: jawnsData,
                                backgroundColor: jawnColor,
                                borderRadius: 4,
                                order: 2
                            },
                            {
                                label: 'Not Jawns',
                                data: notJawnsData,
                                backgroundColor: notJawnColor,
                                borderRadius: 4,
                                order: 3 
                            },
                            {
                                label: 'Total Spins',
                                data: spinsData,
                                borderColor: lineColor,
                                backgroundColor: lineColor,
                                borderRadius: 4,
                                type: 'line',
                                tension: 0.4,
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: textColor } },
                            tooltip: { mode: 'index', intersect: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: gridColor },
                                ticks: { color: textColor }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: textColor }
                            }
                        }
                    }
                });
            }

            function getCurrentMonthKey() {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            }

            function recordSpinResult(isJawn) {
                // IMPORTANT: If auth failed, this might throw permission denied
                const monthKey = getCurrentMonthKey();
                const updates = [
                    ref(db, 'stats/global/spins'),
                    ref(db, `stats/history/${monthKey}/spins`)
                ];

                if (isJawn) {
                    updates.push(ref(db, 'stats/global/jawns'));
                    updates.push(ref(db, `stats/history/${monthKey}/jawns`));
                } else {
                    updates.push(ref(db, 'stats/global/notJawns'));
                    updates.push(ref(db, `stats/history/${monthKey}/notJawns`));
                }

                updates.forEach(reference => {
                    runTransaction(reference, (current) => (current || 0) + 1);
                });
            }

            // Listen for Stats Changes
            onValue(ref(db, 'stats'), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const global = data.global || { spins: 0, jawns: 0, notJawns: 0 };
                const history = data.history || {};

                // Update Pill
                document.getElementById('stat-spins').textContent = (global.spins || 0).toLocaleString();
                document.getElementById('stat-jawns').textContent = (global.jawns || 0).toLocaleString();
                document.getElementById('stat-not-jawns').textContent = (global.notJawns || 0).toLocaleString();

                // Update Modal Cards
                document.getElementById('modal-total-spins').textContent = (global.spins || 0).toLocaleString();
                document.getElementById('modal-total-jawns').textContent = (global.jawns || 0).toLocaleString();
                document.getElementById('modal-total-not-jawns').textContent = (global.notJawns || 0).toLocaleString();

                // Update Table
                const tbody = document.getElementById('history-table-body');
                tbody.innerHTML = ''; 
                const sortedMonthsDesc = Object.keys(history).sort().reverse();

                sortedMonthsDesc.forEach(month => {
                    const mData = history[month];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${month}</td>
                        <td style="color: var(--text-color); font-weight: bold;">${(mData.spins || 0).toLocaleString()}</td>
                        <td style="color: var(--jawn-color);">${(mData.jawns || 0).toLocaleString()}</td>
                        <td style="color: var(--not-jawn-color);">${(mData.notJawns || 0).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });

                initChart(history);
            });

            // Modal Controls
            const statsModal = document.getElementById('stats-modal');
            const statsPill = document.getElementById('global-stats-pill');
            const closeStatsBtn = document.getElementById('close-stats');

            statsPill.addEventListener('click', () => {
                statsModal.classList.add('active');
                if(myChart) myChart.resize(); 
            });

            closeStatsBtn.addEventListener('click', () => {
                statsModal.classList.remove('active');
            });

            statsModal.addEventListener('click', (e) => {
                if (e.target === statsModal) {
                    statsModal.classList.remove('active');
                }
            });

            // Theme Toggle
            const themeToggleButton = document.getElementById('theme-toggle');
            const htmlElement = document.documentElement;
            const currentTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (currentTheme === 'dark') {
                htmlElement.classList.add('dark-mode');
            } else if (currentTheme === 'light') {
                htmlElement.classList.remove('dark-mode');
            } else if (prefersDark) {
                htmlElement.classList.add('dark-mode');
            }

            themeToggleButton.addEventListener('click', function() {
                htmlElement.classList.toggle('dark-mode');
                if (htmlElement.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                } else {
                    localStorage.setItem('theme', 'light');
                }
                updateChartColors();
            });

            function getLevenshteinDistance(a, b) {
                if (a.length === 0) return b.length;
                if (b.length === 0) return a.length;
                const matrix = [];
                for (let i = 0; i <= b.length; i++) {
                    matrix[i] = [i];
                }
                for (let j = 0; j <= a.length; j++) {
                    matrix[0][j] = j;
                }
                for (let i = 1; i <= b.length; i++) {
                    for (let j = 1; j <= a.length; j++) {
                        const cost = a[j - 1] === b[i - 1] ? 0 : 1;
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j] + 1,      
                            matrix[i][j - 1] + 1,      
                            matrix[i - 1][j - 1] + cost 
                        );
                    }
                }
                return matrix[b.length][a.length];
            }

            const wheel = document.getElementById('wheel');
            const spinButton = document.getElementById('spin-button');
            const nameInput = document.getElementById('name-list-input');
            const resultTitle = document.getElementById('result-title');
            const resultsPlaceholder = document.getElementById('results-placeholder');
            const copyButton = document.getElementById('copy-button');
            
            let allResults = [];
            let isSpinning = false;
            let currentRotation = 0;
            const numSlices = 8;
            const sliceAngle = 360 / numSlices;

            function spinForName(name, duration) {
                return new Promise((resolve) => {
                    const targetWord = "jawn";
                    const distance = getLevenshteinDistance(name.toLowerCase(), targetWord);
                    const probabilityMap = { 0: 1.0, 1: 0.95, 2: 0.85, 3: 0.70, 4: 0.60, 5: 0.40 };
                    const jawnProbability = probabilityMap[distance] !== undefined ? probabilityMap[distance] : 0.20;
                    const isJawn = Math.random() < jawnProbability;
                    
                    recordSpinResult(isJawn);

                    const resultString = isJawn ? 'JAWN' : 'NOT A JAWN';
                    const percentageString = Math.round(jawnProbability * 100);

                    allResults.push(`${name}: ${resultString} (${percentageString}% Jawn)`);

                    let sliceNumber;
                    if (isJawn) {
                        const jawnSlices = [0, 2, 4, 6];
                        sliceNumber = jawnSlices[Math.floor(Math.random() * jawnSlices.length)];
                    } else {
                        const notJawnSlices = [1, 3, 5, 7];
                        sliceNumber = notJawnSlices[Math.floor(Math.random() * notJawnSlices.length)];
                    }

                    const centerOfSlice = sliceNumber * sliceAngle;
                    const randomOffset = (Math.random() * (sliceAngle - 15)) - (sliceAngle / 2 - 7.5);
                    const landAngle = centerOfSlice + randomOffset;
                    const totalRotation = currentRotation + 7200 + landAngle; 

                    wheel.style.transition = `transform ${duration / 1000}s ease-out`;
                    wheel.style.transform = `rotate(${totalRotation}deg)`;

                    setTimeout(() => {
                        currentRotation = totalRotation % 360; 
                        wheel.style.transition = 'none'; 
                        wheel.style.transform = `rotate(${currentRotation}deg)`;
                        void wheel.offsetWidth; 

                        const resultLine = document.createElement('div');
                        resultLine.className = 'result-line';
                        const statusSpan = document.createElement('span');
                        statusSpan.textContent = resultString;
                        statusSpan.className = isJawn ? 'status-jawn' : 'status-not-jawn';
                        const percentSpan = document.createElement('span');
                        percentSpan.className = 'status-percent';
                        percentSpan.textContent = ` (${percentageString}% Jawn)`;
                        
                        resultLine.textContent = `${name}: `;
                        resultLine.appendChild(statusSpan);
                        resultLine.appendChild(percentSpan);
                        resultsPlaceholder.appendChild(resultLine);

                        resolve(); 
                    }, duration);
                });
            }

            async function processNames() {
                allResults = [];
                const names = nameInput.value.split('\n').map(name => name.trim()).filter(name => name.length > 0);

                if (names.length === 0) {
                    resultTitle.textContent = 'Please enter at least one name.';
                    resultsPlaceholder.classList.add('is-placeholder');
                    resultsPlaceholder.textContent = 'Please enter at least one name.';
                    isSpinning = false;
                    spinButton.disabled = false;
                    return;
                }

                let spinDuration = 4000;
                let pauseDuration = 1000;
                if (names.length > 5) { spinDuration = 2000; pauseDuration = 500; }
                if (names.length > 10) { spinDuration = 1000; pauseDuration = 250; }
                
                for (const name of names) {
                    await spinForName(name, spinDuration); 
                    await new Promise(resolve => setTimeout(resolve, pauseDuration)); 
                }

                isSpinning = false;
                spinButton.disabled = false;
                resultTitle.textContent = 'Results:';
                if (allResults.length > 0) copyButton.style.display = 'flex';
                resultsPlaceholder.classList.add('animation-complete');
                setTimeout(() => { resultsPlaceholder.classList.remove('animation-complete'); }, 600); 
            }

            spinButton.addEventListener('click', function() {
                if (isSpinning) return;
                isSpinning = true;
                spinButton.disabled = true;
                resultsPlaceholder.innerHTML = ''; 
                resultsPlaceholder.classList.remove('is-placeholder');
                resultTitle.textContent = 'Spinning...';
                copyButton.style.display = 'none';
                copyButton.classList.remove('copied');
                processNames();
            });

            copyButton.addEventListener('click', function() {
                const textToCopy = allResults.join('\n');
                navigator.clipboard.writeText(textToCopy).then(() => {
                    copyButton.classList.add('copied');
                    setTimeout(() => { copyButton.classList.remove('copied'); }, 2000);
                });
            });

            const html = document.documentElement;
            window.addEventListener('mousemove', (e) => {
                requestAnimationFrame(() => {
                    const xPercent = (e.clientX / window.innerWidth) - 0.5;
                    const yPercent = (e.clientY / window.innerHeight) - 0.5;
                    html.style.setProperty('--mouse-x-percent', xPercent);
                    html.style.setProperty('--mouse-y-percent', yPercent);
                });
            });
        </script>
    </body>
</html>
